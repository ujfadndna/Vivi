services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      WORKSPACE_DIR: "${WORKSPACE_DIR:-./workspace}"
      API_PORT: "${API_PORT:-8100}"
      WEB_ORIGIN: "${WEB_ORIGIN:-http://localhost:5173}"
      DEPLOYMENT_MODE: "${DEPLOYMENT_MODE:-mock}"
      INGEST_BACKEND: "${INGEST_BACKEND:-mock}"
      TTS_BACKEND: "${TTS_BACKEND:-mock}"
      MUSETALK_BACKEND: "${MUSETALK_BACKEND:-mock}"
      SEGMENT_BACKEND: "${SEGMENT_BACKEND:-mock}"
      BACKGROUND_BACKEND: "${BACKGROUND_BACKEND:-mock}"
      COMPOSITE_BACKEND: "${COMPOSITE_BACKEND:-local}"
      SKIP_RVM: "${SKIP_RVM:-true}"
      CELERY_TASK_ALWAYS_EAGER: "${CELERY_TASK_ALWAYS_EAGER:-true}"
      CELERY_BROKER_URL: "${CELERY_BROKER_URL:-redis://redis:6379/0}"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-redis://redis:6379/1}"
    ports:
      - "8100:8100"
    volumes:
      - ./workspace:/app/workspace
    depends_on:
      - redis

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis-data:
